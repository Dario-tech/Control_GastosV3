<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom desactivado a propósito: evita que la PWA se amplíe sola en iPhone.
         Es un compromiso de accesibilidad pendiente de revisar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent: la app pinta bajo la barra de estado/isla (viewport-fit=cover);
         la cabecera lleva su propio fondo del tema en esa zona. iOS solo lee este valor al instalar. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gastos" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS: sin icono PNG ni imagen de arranque del tamaño exacto del iPhone, la app instalada
         puede abrirse con la ventana más corta que la pantalla (franja vacía abajo, cabecera mal
         compuesta). Un fichero por tamaño de pantalla; hay que reinstalar el icono para que iOS los lea. -->
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="/pwa/splash-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

    <link rel="apple-touch-startup-image" href="/pwa/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
